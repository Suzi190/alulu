<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f5f0eb"/>
<title>Lunara AI</title>
<style>
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#f5f0eb;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
  main{width:min(360px,calc(100vw - 40px));text-align:center}
  img{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 28px rgba(180,72,112,.18)}
  h1{font-size:22px;margin:18px 0 8px}
  p{margin:0;color:#6c6c70;line-height:1.65;font-size:14px}
  button{margin-top:18px;border:0;border-radius:999px;background:#ff8fab;color:#fff;font-weight:800;padding:12px 18px;font:inherit}
</style>
</head>
<body>
<main>
  <img src="/icons/lunara-1024.png" alt="Lunara AI"/>
  <h1>Lunara AI</h1>
  <p>当前网络不可用。已安装的内容会继续保留，联网后刷新即可同步最新版本。</p>
  <button onclick="location.reload()">刷新</button>
</main>
</body>
</html>
