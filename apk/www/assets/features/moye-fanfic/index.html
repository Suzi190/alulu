<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <meta name="description" content="墨页：角色驱动的同人文阅读与创作空间" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>墨页 / FIC NEST</title>
    <script>if(new URLSearchParams(location.search).get('embed')==='1'||window.frameElement?.hasAttribute('data-lunara-moye-embedded'))document.documentElement.classList.add('moye-embedded');</script>
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">M</div>
          <div>
            <div class="brand-name">墨页</div>
            <div class="brand-sub">FIC NEST / 01</div>
          </div>
        </div>

        <div class="rail-label">阅读</div>
        <nav class="rail-nav" id="rail-nav">
          <button class="nav-item is-active" data-view="home"><i data-lucide="layout-grid"></i><span>首页</span><b>01</b></button>
          <button class="nav-item" data-view="library"><i data-lucide="library"></i><span>作品库</span><b id="library-count">03</b></button>
          <button class="nav-item" data-view="bookmarks"><i data-lucide="bookmark"></i><span>收藏夹</span><b id="bookmark-count">02</b></button>
          <button class="nav-item" data-view="characters"><i data-lucide="users-round"></i><span>角色卡</span><b id="character-count">00</b></button>
        </nav>

        <div class="rail-label rail-label-spaced">创作</div>
        <nav class="rail-nav">
          <button class="nav-item nav-create" data-view="creator"><i data-lucide="pen-line"></i><span>委托新故事</span><b>+</b></button>
        </nav>

        <div class="rail-bottom">
          <div class="rail-status"><span class="status-dot"></span><span>本地档案已保存</span></div>
          <button class="nav-item" data-view="settings"><i data-lucide="sliders-horizontal"></i><span>设置</span></button>
          <div class="rail-footnote">LOCAL FIRST<br />BUILD 0.1.0</div>
        </div>
      </aside>

      <div class="mobile-topbar">
        <button class="icon-button" id="mobile-menu" aria-label="打开导航"><i data-lucide="menu"></i></button>
        <div class="mobile-brand"><span class="brand-mark small">M</span><span>墨页</span></div>
        <button class="icon-button" data-view="settings" aria-label="打开设置"><i data-lucide="sliders-horizontal"></i></button>
      </div>

      <main class="main-column" id="main-column"></main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="移动端导航">
        <button class="bottom-item is-active" data-view="home"><i data-lucide="layout-grid"></i><span>首页</span></button>
        <button class="bottom-item" data-view="library"><i data-lucide="library"></i><span>作品</span></button>
        <button class="bottom-item bottom-create" data-view="creator"><i data-lucide="plus"></i><span>新建</span></button>
        <button class="bottom-item" data-view="bookmarks"><i data-lucide="bookmark"></i><span>收藏</span></button>
        <button class="bottom-item" data-view="settings"><i data-lucide="sliders-horizontal"></i><span>设置</span></button>
      </nav>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="vendor/lucide.min.js"></script>
    <script src="app.js?v=20260909007" defer></script>
  </body>
</html>
